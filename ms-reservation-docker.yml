server:
  port: 3005
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-reservation
  datasource:
    url: jdbc:postgresql://${DB_HOST:db-reservation}:5432/${DB_NAME:reservation_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://pgvpt-discovery:8761/eureka/
  instance:
    prefer-ip-address: true
