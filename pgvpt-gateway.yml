server:
  port: 8080

spring:
  application:
    name: pgvpt-gateway

  cloud:
    gateway:
      routes:
        - id: ms-patrimoine
          uri: lb://ms-patrimoine
          predicates:
            - Path=/api/v1/patrimoines/**
        - id: ms-geolocalisation
          uri: lb://ms-geolocalisation
          predicates:
            - Path=/api/v1/geolocalisations/**

        - id: ms-contenu
          uri: lb://ms-contenu
          predicates:
            - Path=/api/v1/contenus/**

        - id: ms-media
          uri: lb://ms-media
          predicates:
            - Path=/api/v1/medias/**

        - id: ms-circuit
          uri: lb://ms-circuit
          predicates:
            - Path=/api/v1/circuits/**

        - id: ms-evenement
          uri: lb://ms-evenement
          predicates:
            - Path=/api/v1/evenements/**

        - id: ms-evenement-sessions
          uri: lb://ms-evenement
          predicates:
            - Path=/api/v1/sessions/**

        - id: ms-tourisme-offres
          uri: lb://ms-tourisme
          predicates:
            - Path=/api/v1/offres/**

        - id: ms-tourisme-prestations
          uri: lb://ms-tourisme
          predicates:
            - Path=/api/v1/prestations/**

        - id: ms-identite-auth
          uri: lb://ms-identite
          predicates:
            - Path=/api/v1/auth/**

        - id: ms-identite-users
          uri: lb://ms-identite
          predicates:
            - Path=/api/v1/users/**

        - id: ms-reservation
          uri: lb://ms-reservation
          predicates:
            - Path=/api/v1/reservations/**

        - id: ms-reservation-participants
          uri: lb://ms-reservation
          predicates:
            - Path=/api/v1/participants/**

        - id: ms-reservation-disponibilites
          uri: lb://ms-reservation
          predicates:
            - Path=/api/v1/disponibilites/**

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://pgvpt-discovery:8761/eureka/

  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
