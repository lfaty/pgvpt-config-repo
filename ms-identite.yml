server:
  port: 3008
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-identite
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWKS_URL:http://${KEYCLOAK_HOST:pgvpt-keycloak}:${KEYCLOAK_PORT:8080}/realms/pgvpt/protocol/openid-connect/certs}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5440}/${DB_NAME:identite_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

keycloak:
  url: ${KEYCLOAK_URL:http://${KEYCLOAK_HOST:pgvpt-keycloak}:${KEYCLOAK_PORT:8080}}
  realm: ${KEYCLOAK_REALM:pgvpt}
  client-id: ${KEYCLOAK_CLIENT_ID:pgvpt-identite-api}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:pgvpt-identite-secret-2026}


