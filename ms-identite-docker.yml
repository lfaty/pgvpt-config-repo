server:
  port: 3008
  servlet:
    context-path: /api/v1

spring:
  application:
    name: ms-identite
  datasource:
    url: jdbc:postgresql://${DB_HOST:db-identite}:${DB_PORT:5432}/${DB_NAME:identite_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://pgvpt-discovery:8761/eureka/
  instance:
    prefer-ip-address: true

