# ==========================================
# CONFIGURATION DE LA DATASOURCE (POSTGRESQL)
# ==========================================
spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:db-circuit}:5432/${DB_NAME:circuit_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}


# ==========================================
# CONFIGURATION EUREKA DISCOVERY
# ==========================================
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://pgvpt-discovery:8761/eureka/

  instance:
    prefer-ip-address: true
